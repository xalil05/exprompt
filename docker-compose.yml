services:
  exprompt:
    build: .
    container_name: exprompt
    ports:
      - "8022:8022"
    env_file:
      - .env
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-deepseek}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
    restart: unless-stopped
