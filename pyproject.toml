[project]
name = "exprompt"
version = "0.1.0"
description = "Prompt Factory — transforme un brief en prompt prêt à copier-coller via INTAKE → CREATIVE_WRITER → AUTO_QA"
authors = [{ name = "AMICO TECH", email = "youngkhalil1997@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "pydantic>=2,<3",
    "pydantic-settings>=2,<3",
    "httpx>=0.27,<1",
    "typer>=0.12,<1",
    "pyyaml>=6,<7",
    "rich>=13,<14",
    "openai>=1.50,<2",
]

[project.scripts]
exprompt = "exprompt.main:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
